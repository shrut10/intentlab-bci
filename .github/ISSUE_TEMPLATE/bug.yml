name: Bug report
description: Report a reproducible problem with the demo or code
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page or command, browser or Python version, commit if known, and a public trial ID if relevant
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting output or screenshot
      description: Remove credentials and personal information; use only public or synthetic data

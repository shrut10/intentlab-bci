[project]
name = "intentlab-bci"
version = "1.0.0"
description = "Motor-imagery EEG decoding with uncertainty and participant-disjoint evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "onnxruntime==1.30.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
